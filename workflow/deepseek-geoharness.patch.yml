- id: credentials
  disabled: false
- id: authorization
  disabled: false
- id: deepseek-account
  disabled: false
- insert:
    - id: mcp-geoharness
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: geoharness
        transport: stdio
        command: !!js process.cwd() + '/geoharness/.venv/Scripts/geoharness-mcp.exe'
        args:
          - --workspace
          - !!js process.cwd()
        startupTimeoutMs: 90000
        toolCallTimeoutMs: 150000
        failOnStartupError: true
